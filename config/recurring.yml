# Solid Queue recurring schedule.
# Loaded by the Solid Queue supervisor in production; not active in
# dev/test unless you run `bin/jobs` with the scheduler.

production:
  weekly_pulse:
    class: WeeklyPulseJob
    schedule: "0 8 * * 1"           # Monday 08:00 (server time)

  folder_sync:
    class: FolderSyncJob
    schedule: every 15 minutes

  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
