# Kamal 2 deployment for brain.
#
# Cloudflare in front handles SSL termination. Kamal's proxy still runs
# (it's how rolling-restart + rollback work) but with SSL OFF — the box
# speaks plain HTTP on 80, Cloudflare gives end users HTTPS at the edge.
#
# Build flow: image pushed to GHCR (private), box pulls. Set
# KAMAL_REGISTRY_PASSWORD in your shell before `bin/kamal deploy`.

service: brain
image: iamluis/cozybrain

servers:
  web:
    - 100.106.72.125              # brain over Tailscale; the box's public
                                  # IP can stay closed to all but Cloudflare
                                  # on port 80.

# Cloudflare handles SSL; we just need the proxy to vhost-route to the
# right container and do zero-downtime restarts.
proxy:
  ssl: false
  host: brain.cozyedge.tech
  app_port: 80

registry:
  server: ghcr.io
  username: iamluis
  password:
    - KAMAL_REGISTRY_PASSWORD     # GitHub PAT with write:packages

builder:
  arch: amd64

env:
  clear:
    SOLID_QUEUE_IN_PUMA: "true"
  secret:
    - RAILS_MASTER_KEY
    - RAILS_INBOUND_EMAIL_PASSWORD

# Persistent state — survives container restarts and image rebuilds.
volumes:
  - "brain_db:/rails/storage"
  - "brain_storage:/rails/storage_files"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell:   app exec --interactive --reuse "bash"
  logs:    app logs --follow
  status:  app details
