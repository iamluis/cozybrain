# Production compose for brain — runs on the Hetzner box.
#
# Caddy fronts the app on 80/443. Auto-issues + renews Let's Encrypt
# certs (HTTP-01 challenge on port 80). The Rails container speaks plain
# HTTP on 80 internally; only Caddy is exposed to the public ports.

services:
  app:
    image: brain:latest
    build: .
    restart: unless-stopped
    expose:
      - "80"             # internal only — Caddy reverse-proxies to it
    environment:
      RAILS_ENV: production
      SOLID_QUEUE_IN_PUMA: "true"
      RAILS_LOG_TO_STDOUT: "true"
      RAILS_SERVE_STATIC_FILES: "true"
    volumes:
      # SQLite (primary + cache + queue + cable) — local NVMe.
      # Bench: 803 IOPS @ 40 µs vs network volume's 112 IOPS @ 89 µs.
      - /opt/brain-db:/rails/storage
      # Active Storage blobs — network volume (cheaper to grow).
      - /mnt/HC_Volume_105702184/brain:/rails/blobs
      - ./config/master.key:/rails/config/master.key:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # ACME certs + account live here
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
